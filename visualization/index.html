<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Rubik's Cube Solver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            overflow: hidden;
            height: 100vh;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #canvas-wrapper {
            flex: 1;
            position: relative;
            background: #e8edf3;
        }

        canvas {
            display: block;
        }

        #sidebar {
            width: 26%;
            min-width: 380px;
            max-width: 450px;
            background: #ffffff;
            border-left: 1px solid #d0d7e3;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: -2px 0 8px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a2a4a;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            letter-spacing: 0.3px;
        }

        h1 span.sub {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #7a8aaa;
            margin-top: 4px;
            letter-spacing: 0;
        }

        h2 {
            font-size: 13px;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
            margin-top: 6px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .btn {
            padding: 10px 6px;
            border: 1px solid #d1d9e6;
            background: #f8fafc;
            color: #2d3748;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Consolas', 'Courier New', monospace;
            transition: all 0.12s ease;
            text-align: center;
        }

        .btn:hover {
            background: #edf2ff;
            border-color: #6c8ebf;
            color: #1a3a6e;
        }

        .btn:active {
            transform: scale(0.95);
            background: #dbeafe;
        }

        .btn-action {
            grid-column: span 3;
            padding: 9px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
        }

        .btn-action.primary {
            background: #2563eb;
            border-color: #1d4ed8;
            color: #ffffff;
        }

        .btn-action.primary:hover {
            background: #1d4ed8;
            border-color: #1e40af;
        }

        .btn-action.secondary {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #374151;
        }

        .btn-action.secondary:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .btn-action.danger {
            background: #fff5f5;
            border-color: #fed7d7;
            color: #c53030;
        }

        .btn-action.danger:hover {
            background: #fed7d7;
            border-color: #fc8181;
        }

        .btn-action.success {
            background: #f0fff4;
            border-color: #9ae6b4;
            color: #276749;
        }

        .btn-action.success:hover {
            background: #c6f6d5;
            border-color: #68d391;
        }

        .btn-action.purple {
            background: #faf5ff;
            border-color: #d6bcfa;
            color: #6b21a8;
        }

        .btn-action.purple:hover {
            background: #ede9fe;
            border-color: #a78bfa;
        }

        .btn-action.indigo {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #3730a3;
        }

        .btn-action.indigo:hover {
            background: #e0e7ff;
            border-color: #a5b4fc;
        }

        #status {
            font-size: 12px;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            line-height: 1.8;
        }

        #status .label {
            color: #718096;
            font-weight: 600;
        }

        #status .value {
            color: #2d3748;
        }

        #status .solved {
            color: #276749;
            font-weight: 700;
        }

        #status .unsolved {
            color: #c53030;
        }

        #move-log {
            font-size: 11px;
            padding: 8px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            max-height: 70px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            color: #4a5568;
            word-break: break-all;
            line-height: 1.5;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        #solution-output {
            font-size: 12px;
            padding: 9px;
            background: #f0fdf4;
            border-radius: 6px;
            border: 1px solid #bbf7d0;
            color: #166534;
            font-family: 'Consolas', monospace;
            min-height: 32px;
            word-break: break-all;
            line-height: 1.6;
        }

        #now-playing {
            font-size: 11px;
            padding: 5px 8px;
            background: #fffbeb;
            border-radius: 4px;
            border: 1px solid #fde68a;
            color: #92400e;
            font-family: 'Consolas', monospace;
            min-height: 22px;
            margin-top: 4px;
            display: none;
        }

        .speed-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            font-size: 11px;
            color: #718096;
        }

        .speed-row select {
            background: #f8fafc;
            color: #2d3748;
            border: 1px solid #d1d9e6;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .benchmark-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 8px;
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .benchmark-table th, .benchmark-table td {
            padding: 6px 5px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }

        .benchmark-table th {
            background: #f1f5f9;
            color: #374151;
            font-weight: 700;
        }

        .benchmark-table tr:last-child td {
            border-bottom: none;
        }

        .benchmark-table td:first-child, .benchmark-table th:first-child {
            text-align: left;
            padding-left: 8px;
        }

        .benchmark-table tr:hover td {
            background: #f8fafc;
        }

        .highlight-ai {
            color: #6b21a8;
            font-weight: 600;
        }

        .highlight-koc {
            color: #166534;
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }
        .tag-ai { background: #ede9fe; color: #6b21a8; }
        .tag-koc { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-wrapper"></div>
        <div id="sidebar">
            <h1>
                AI Rubik's Cube Solver
                <span class="sub">Neural Network + Kociemba Expert Solver</span>
            </h1>

            <div class="section">
                <h2>Face Moves</h2>
                <div class="btn-group" id="move-buttons"></div>
            </div>

            <div class="section">
                <h2>Actions</h2>
                <div class="btn-group">
                    <button class="btn btn-action primary" onclick="doScramble()">Scramble (20)</button>
                    <button class="btn btn-action secondary" style="grid-column: span 1;" onclick="doScramble(5)">Scramble (5)</button>
                    <button class="btn btn-action danger" style="grid-column: span 2;" onclick="doReset()">Reset Cube</button>
                </div>
                <div class="btn-group" style="margin-top: 5px;">
                    <button class="btn btn-action success" style="grid-column: span 3;" onclick="doSolve()">Solve - Kociemba (Expert)</button>
                </div>
                <div class="btn-group" style="margin-top: 5px;">
                    <button class="btn btn-action purple" style="grid-column: span 1;" onclick="doSolveAI()">AI Greedy</button>
                    <button class="btn btn-action indigo" style="grid-column: span 2;" onclick="doSolveAIBeam()">AI Beam Search (w=5)</button>
                </div>
                <div class="speed-row">
                    <span>Animation speed:</span>
                    <select id="speed-select">
                        <option value="0.5">Slow</option>
                        <option value="1.2" selected>Normal</option>
                        <option value="2.5">Fast</option>
                        <option value="5">Very Fast</option>
                    </select>
                </div>
                <button class="btn btn-action secondary" style="margin-top: 5px; grid-column: span 3;" onclick="doCompareBenchmark()">Run Benchmark (AI vs Kociemba)</button>
            </div>

            <div class="section">
                <h2>Cube Status</h2>
                <div id="status">
                    <span class="label">State:</span> <span id="state-val" class="value">Loading...</span><br>
                    <span class="label">Legal:</span> <span id="legal-val" class="value">-</span><br>
                    <span class="label">Corners:</span> <span id="corners-val" class="value">-</span><br>
                    <span class="label">Edges:</span> <span id="edges-val" class="value">-</span>
                </div>
            </div>

            <div class="section">
                <h2>Solution</h2>
                <div id="solution-output">No solution yet.</div>
                <div id="now-playing"></div>
            </div>

            <div class="section">
                <h2>Move History</h2>
                <div id="move-log">No moves applied.</div>
            </div>

            <div class="section">
                <h2>Benchmark Options</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
                    <div>
                        <label style="font-size: 13px; color: #333; display: block; margin-bottom: 6px; font-weight: 600;">Max Depth:</label>
                        <select id="benchmark-max-depth" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: white; cursor: pointer;">
                            <option value="5">Depth 1-5</option>
                            <option value="6">Depth 1-6</option>
                            <option value="7">Depth 1-7</option>
                            <option value="8" selected>Depth 1-8</option>
                            <option value="9">Depth 1-9</option>
                            <option value="10">Depth 1-10</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 13px; color: #333; display: block; margin-bottom: 6px; font-weight: 600;">Tests/Depth:</label>
                        <select id="benchmark-tests-per-depth" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: white; cursor: pointer;">
                            <option value="3">3 tests</option>
                            <option value="5" selected>5 tests</option>
                            <option value="10">10 tests</option>
                            <option value="20">20 tests</option>
                            <option value="50">50 tests</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="benchmark-section" class="section" style="display: none;">
                <h2>Benchmark Results <span class="tag tag-koc">Kociemba</span> <span class="tag tag-ai">Greedy</span> <span class="tag tag-ai">Beam</span></h2>
                <div id="benchmark-output"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const wrapper = document.getElementById('canvas-wrapper');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe8edf3);

        const camera = new THREE.PerspectiveCamera(45, wrapper.clientWidth / wrapper.clientHeight, 0.1, 100);
        camera.position.set(5, 4, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        wrapper.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 4;
        controls.maxDistance = 15;

        // Lights tuned for a bright, clean look on light background
        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(6, 10, 6);
        sun.castShadow = true;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0xddeeff, 0.4);
        fill.position.set(-5, -2, -5);
        scene.add(fill);

        // Face colors - bold and saturated so they read well on a light background
        const COLORS = {
            'U': 0xFFFFFF, 'R': 0xEE2222, 'F': 0x00BB33,
            'D': 0xFFDD00, 'L': 0xFF7700, 'B': 0x1155EE
        };
        const INTERNAL_COLOR = 0x1a1a1a;
        const CUBIE_SIZE = 0.95;

        const CORNER_POS = [
            new THREE.Vector3( 1, 1, 1), new THREE.Vector3(-1, 1, 1),
            new THREE.Vector3(-1, 1,-1), new THREE.Vector3( 1, 1,-1),
            new THREE.Vector3( 1,-1, 1), new THREE.Vector3(-1,-1, 1),
            new THREE.Vector3(-1,-1,-1), new THREE.Vector3( 1,-1,-1)
        ];
        const CORNER_COLORS = [
            ['U','R','F'], ['U','F','L'], ['U','L','B'], ['U','B','R'],
            ['D','F','R'], ['D','L','F'], ['D','B','L'], ['D','R','B']
        ];

        const EDGE_POS = [
            new THREE.Vector3( 1, 1, 0), new THREE.Vector3( 0, 1, 1),
            new THREE.Vector3(-1, 1, 0), new THREE.Vector3( 0, 1,-1),
            new THREE.Vector3( 1,-1, 0), new THREE.Vector3( 0,-1, 1),
            new THREE.Vector3(-1,-1, 0), new THREE.Vector3( 0,-1,-1),
            new THREE.Vector3( 1, 0, 1), new THREE.Vector3(-1, 0, 1),
            new THREE.Vector3(-1, 0,-1), new THREE.Vector3( 1, 0,-1)
        ];
        const EDGE_COLORS = [
            ['U','R'], ['U','F'], ['U','L'], ['U','B'],
            ['D','R'], ['D','F'], ['D','L'], ['D','B'],
            ['F','R'], ['F','L'], ['B','L'], ['B','R']
        ];

        const CENTER_POS = [
            new THREE.Vector3( 0, 1, 0), new THREE.Vector3( 1, 0, 0),
            new THREE.Vector3( 0, 0, 1), new THREE.Vector3( 0,-1, 0),
            new THREE.Vector3(-1, 0, 0), new THREE.Vector3( 0, 0,-1)
        ];
        const CENTER_COLORS = [['U'], ['R'], ['F'], ['D'], ['L'], ['B']];

        const FACE_MAP = {
            'U': new THREE.Vector3(0, 1, 0), 'D': new THREE.Vector3(0, -1, 0),
            'R': new THREE.Vector3(1, 0, 0), 'L': new THREE.Vector3(-1, 0, 0),
            'F': new THREE.Vector3(0, 0, 1), 'B': new THREE.Vector3(0, 0, -1)
        };
        const getNormals = (type, id) => (type === 'corner' ? CORNER_COLORS[id] : EDGE_COLORS[id]).map(c => FACE_MAP[c]);

        // Precompute the 24 cubic rotation quaternions
        const Q24 = [];
        [0, 1, 2, 3].forEach(x => [0, 1, 2, 3].forEach(y => [0, 1, 2, 3].forEach(z => {
            const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(x*Math.PI/2, y*Math.PI/2, z*Math.PI/2));
            if (!Q24.some(oq => Math.abs(q.dot(oq)) > 0.99)) Q24.push(q);
        })));

        // Build the scene objects
        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);
        const pivot = new THREE.Group();
        scene.add(pivot);

        const corners = [], edges = [], centers = [];

        function createRigidCubie(pos, colorList) {
            const group = new THREE.Group();
            group.position.copy(pos);

            const baseMesh = new THREE.Mesh(
                new THREE.BoxGeometry(CUBIE_SIZE, CUBIE_SIZE, CUBIE_SIZE),
                new THREE.MeshPhongMaterial({ color: INTERNAL_COLOR })
            );
            group.add(baseMesh);

            const planeGeo = new THREE.PlaneGeometry(0.85, 0.85);
            for (let colorName of colorList) {
                const mat = new THREE.MeshBasicMaterial({ color: COLORS[colorName] });
                const mesh = new THREE.Mesh(planeGeo, mat);
                mesh.position.copy(FACE_MAP[colorName]).multiplyScalar(0.48);
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), FACE_MAP[colorName]);
                group.add(mesh);
            }
            cubeGroup.add(group);
            return group;
        }

        for (let i = 0; i < 8; i++) corners.push(createRigidCubie(CORNER_POS[i], CORNER_COLORS[i]));
        for (let i = 0; i < 12; i++) edges.push(createRigidCubie(EDGE_POS[i], EDGE_COLORS[i]));
        for (let i = 0; i < 6; i++) centers.push(createRigidCubie(CENTER_POS[i], CENTER_COLORS[i]));

        // Sync 3D positions to backend cubie state (cp/co/ep/eo)
        function findPieceRotation(startPos, startRef, targetPos, targetRef) {
            for (let q of Q24) {
                const p = startPos.clone().applyQuaternion(q).round();
                if (p.equals(targetPos)) {
                    const r = startRef.clone().applyQuaternion(q).round();
                    if (r.equals(targetRef)) return q;
                }
            }
            return new THREE.Quaternion();
        }

        function syncState(state) {
            for (let s = 0; s < 8; s++) {
                const p = state.cp[s];
                const mesh = corners[p];
                const q = findPieceRotation(CORNER_POS[p], getNormals('corner', p)[0], CORNER_POS[s], getNormals('corner', s)[state.co[s]]);
                mesh.position.copy(CORNER_POS[s]);
                mesh.quaternion.copy(q);
            }
            for (let s = 0; s < 12; s++) {
                const p = state.ep[s];
                const mesh = edges[p];
                const q = findPieceRotation(EDGE_POS[p], getNormals('edge', p)[0], EDGE_POS[s], getNormals('edge', s)[state.eo[s]]);
                mesh.position.copy(EDGE_POS[s]);
                mesh.quaternion.copy(q);
            }
            snapAllToGrid();
            updateStatus(state);
        }

        function snapMeshToGrid(mesh) {
            mesh.position.x = Math.round(mesh.position.x);
            mesh.position.y = Math.round(mesh.position.y);
            mesh.position.z = Math.round(mesh.position.z);
            const e = new THREE.Euler().setFromQuaternion(mesh.quaternion);
            e.x = Math.round(e.x / (Math.PI / 2)) * (Math.PI / 2);
            e.y = Math.round(e.y / (Math.PI / 2)) * (Math.PI / 2);
            e.z = Math.round(e.z / (Math.PI / 2)) * (Math.PI / 2);
            mesh.quaternion.setFromEuler(e);
        }

        function snapAllToGrid() {
            corners.forEach(snapMeshToGrid);
            edges.forEach(snapMeshToGrid);
            centers.forEach(snapMeshToGrid);
        }

        // Animation framework
        const MOVES = {
            'U':  { axis: 'y', val:  1, ang: -Math.PI/2 }, "U'": { axis: 'y', val:  1, ang:  Math.PI/2 }, 'U2': { axis: 'y', val:  1, ang: -Math.PI },
            'D':  { axis: 'y', val: -1, ang:  Math.PI/2 }, "D'": { axis: 'y', val: -1, ang: -Math.PI/2 }, 'D2': { axis: 'y', val: -1, ang:  Math.PI },
            'R':  { axis: 'x', val:  1, ang: -Math.PI/2 }, "R'": { axis: 'x', val:  1, ang:  Math.PI/2 }, 'R2': { axis: 'x', val:  1, ang: -Math.PI },
            'L':  { axis: 'x', val: -1, ang:  Math.PI/2 }, "L'": { axis: 'x', val: -1, ang: -Math.PI/2 }, 'L2': { axis: 'x', val: -1, ang:  Math.PI },
            'F':  { axis: 'z', val:  1, ang: -Math.PI/2 }, "F'": { axis: 'z', val:  1, ang:  Math.PI/2 }, 'F2': { axis: 'z', val:  1, ang: -Math.PI },
            'B':  { axis: 'z', val: -1, ang:  Math.PI/2 }, "B'": { axis: 'z', val: -1, ang: -Math.PI/2 }, 'B2': { axis: 'z', val: -1, ang:  Math.PI },
        };

        const animQueue = [];
        let isAnimating = false;
        let currentAnim = null;

        function getSolveSpeed() {
            const sel = document.getElementById('speed-select');
            return sel ? parseFloat(sel.value) : 1.2;
        }

        function showNowPlaying(move, current, total, label) {
            const el = document.getElementById('now-playing');
            if (!el) return;
            el.style.display = 'block';
            el.textContent = `${label}  |  Step ${current}/${total}: ${move}`;
        }

        function hideNowPlaying() {
            const el = document.getElementById('now-playing');
            if (el) { el.style.display = 'none'; el.textContent = ''; }
        }

        function processQueue() {
            if (isAnimating || animQueue.length === 0) return;
            const task = animQueue.shift();
            if (task.onStart) task.onStart(task);
            isAnimating = true;

            const moveDef = MOVES[task.move];
            const layerCubies = [];
            const allCubes = corners.concat(edges).concat(centers);
            allCubes.forEach(mesh => {
                if (Math.round(mesh.position[moveDef.axis]) === moveDef.val) {
                    layerCubies.push(mesh);
                }
            });

            pivot.position.set(0, 0, 0);
            pivot.rotation.set(0, 0, 0);
            layerCubies.forEach(mesh => pivot.attach(mesh));

            currentAnim = {
                cubies: layerCubies,
                axis: moveDef.axis,
                startAngle: 0,
                targetAngle: moveDef.ang,
                progress: 0,
                speed: task.speed || 1,
                state: task.state,
                isLast: task.isLast || false,
            };
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isAnimating && currentAnim) {
                currentAnim.progress += 0.08 * currentAnim.speed;
                if (currentAnim.progress >= 1) currentAnim.progress = 1;

                pivot.rotation[currentAnim.axis] = currentAnim.targetAngle * currentAnim.progress;

                if (currentAnim.progress === 1) {
                    currentAnim.cubies.forEach(mesh => cubeGroup.attach(mesh));
                    pivot.rotation.set(0, 0, 0);

                    if (currentAnim.state) syncState(currentAnim.state);
                    else snapAllToGrid();

                    if (currentAnim.isLast) hideNowPlaying();

                    isAnimating = false;
                    currentAnim = null;
                    processQueue();
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
        });

        // UI status display
        function updateStatus(state) {
            document.getElementById('state-val').innerHTML = state.is_solved
                ? '<span class="solved">SOLVED</span>'
                : '<span class="unsolved">Scrambled</span>';
            document.getElementById('legal-val').textContent = state.is_legal ? 'Yes' : 'NO';
            document.getElementById('corners-val').textContent = 'Sum mod 3 = ' + state.corner_orientation_sum;
            document.getElementById('edges-val').textContent = 'Sum mod 2 = ' + state.edge_orientation_sum;
            document.getElementById('move-log').textContent =
                (state.move_history && state.move_history.length > 0)
                    ? state.move_history.join(' ')
                    : 'No moves applied.';
        }

        // API calls
        async function fetchState() {
            try {
                const res = await fetch('/state');
                const data = await res.json();
                syncState(data);
            } catch (e) { console.error('Failed to fetch state:', e); }
        }

        async function sendMove(move) {
            try {
                const res = await fetch('/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ move }),
                });
                const data = await res.json();
                if (data.state) animQueue.push({ move, speed: 1.5, state: data.state });
                processQueue();
            } catch (e) { console.error('Move failed:', e); }
        }

        function queueSolveMoves(moves, finalState, label, speed) {
            const total = moves.length;
            moves.forEach((m, idx) => {
                const isLast = idx === total - 1;
                animQueue.push({
                    move: m,
                    speed,
                    state: isLast ? finalState : null,
                    isLast,
                    onStart: () => showNowPlaying(m, idx + 1, total, label),
                });
            });
            processQueue();
        }

        async function doScramble(length = 20) {
            try {
                const res = await fetch('/scramble', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ length }),
                });
                const data = await res.json();
                document.getElementById('solution-output').textContent = 'Scramble (' + length + '): ' + data.scramble;
                const moves = data.scramble.split(' ');
                moves.forEach((m, idx) => {
                    animQueue.push({ move: m, speed: 5, state: (idx === moves.length - 1) ? data.state : null });
                });
                processQueue();
            } catch (e) { console.error('Scramble failed:', e); }
        }

        async function doSolve() {
            document.getElementById('solution-output').textContent = 'Solving with Kociemba...';
            try {
                const res = await fetch('/solve', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                if (data.solution && data.num_moves > 0) {
                    document.getElementById('solution-output').textContent =
                        `Kociemba: ${data.num_moves} moves in ${data.solve_time.toFixed(4)}s\n${data.solution}`;
                    queueSolveMoves(data.solution.split(' '), data.state, 'Kociemba', getSolveSpeed());
                } else {
                    document.getElementById('solution-output').textContent = 'Already solved!';
                    if (data.state) syncState(data.state);
                }
            } catch (e) { console.error('Solve failed:', e); }
        }

        async function doSolveAI() {
            document.getElementById('solution-output').textContent = 'Solving with AI (Greedy)...';
            try {
                const res = await fetch('/solve_ai', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                if (data.status === 'ok') {
                    if (data.num_moves === 0) {
                        document.getElementById('solution-output').textContent = 'Already solved!';
                    } else {
                        const avgConf = data.confidences.reduce((a, b) => a + b, 0) / data.confidences.length;
                        document.getElementById('solution-output').textContent =
                            `AI Greedy: ${data.num_moves} moves in ${data.solve_time.toFixed(4)}s (avg confidence ${(avgConf * 100).toFixed(1)}%)\n${data.solution}`;
                        queueSolveMoves(data.solution.split(' '), data.state, 'AI Greedy', getSolveSpeed());
                    }
                } else {
                    document.getElementById('solution-output').innerHTML =
                        '<span style="color:#c53030;">AI Greedy: search failed (reached 50-move limit). Model is trained up to depth 5.</span>';
                    if (data.state) syncState(data.state);
                }
            } catch (e) { console.error('AI Solve failed:', e); }
        }

        async function doSolveAIBeam() {
            document.getElementById('solution-output').textContent = 'Solving with AI Beam Search (w=5)...';
            try {
                const res = await fetch('/solve_ai_beam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ beam_width: 5 }),
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    if (data.num_moves === 0) {
                        document.getElementById('solution-output').textContent = 'Already solved!';
                    } else {
                        document.getElementById('solution-output').textContent =
                            `AI Beam Search (w=${data.beam_width}): ${data.num_moves} moves in ${data.solve_time.toFixed(4)}s\n${data.solution}`;
                        queueSolveMoves(data.solution.split(' '), data.state, `AI Beam (w=${data.beam_width})`, getSolveSpeed());
                    }
                } else {
                    document.getElementById('solution-output').innerHTML =
                        '<span style="color:#c53030;">AI Beam Search: no solution found within the depth limit. Model is reliable up to depth 5.</span>';
                    if (data.state) syncState(data.state);
                }
            } catch (e) { console.error('AI Beam Solve failed:', e); }
        }

        async function doCompareBenchmark() {
            const output = document.getElementById('benchmark-output');
            const section = document.getElementById('benchmark-section');
            section.style.display = 'block';

            // Get user-selected parameters
            const maxDepth = parseInt(document.getElementById('benchmark-max-depth').value) || 8;
            const testsPerDepth = parseInt(document.getElementById('benchmark-tests-per-depth').value) || 5;
            const totalTests = maxDepth * testsPerDepth;

            output.innerHTML = `<div style="color:#374151; padding:10px; text-align:center; font-size:12px;">Running ${totalTests} tests (depths 1-${maxDepth}, ${testsPerDepth} per depth)... please wait.</div>`;

            try {
                const res = await fetch('/compare_benchmark', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ max_depth: maxDepth, tests_per_depth: testsPerDepth })
                });
                const data = await res.json();

                if (data.status === 'ok') {
                    let html = `<table class="benchmark-table">
                        <thead><tr>
                            <th>Depth</th>
                            <th class="highlight-koc">Koc%</th>
                            <th class="highlight-ai">Greedy%</th>
                            <th class="highlight-ai">Beam%</th>
                            <th>KocMs</th>
                            <th>AIMs</th>
                        </tr></thead><tbody>`;
                    data.results.forEach(r => {
                        const kocPct  = (r.koc_rate  * 100).toFixed(0);
                        const aiPct   = (r.ai_rate   * 100).toFixed(0);
                        const beamPct = (r.beam_rate * 100).toFixed(0);
                        const aiMs    = r.ai_avg_ms   > 0 ? r.ai_avg_ms.toFixed(1)   : '-';
                        const kocMs   = r.koc_avg_ms  > 0 ? r.koc_avg_ms.toFixed(1)  : '-';
                        html += `<tr>
                            <td>${r.depth}</td>
                            <td class="highlight-koc">${kocPct}%</td>
                            <td class="highlight-ai">${aiPct}%</td>
                            <td class="highlight-ai">${beamPct}%</td>
                            <td>${kocMs}</td>
                            <td>${aiMs}</td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                    html += '<div style="font-size:10px;color:#718096;margin-top:6px;">All times in ms. AI is faster but less reliable at higher depths.</div>';
                    output.innerHTML = html;
                }
            } catch (e) {
                console.error('Benchmark failed:', e);
                output.innerHTML = '<div style="color:#c53030;">Benchmark failed. Check the server console.</div>';
            }
        }

        async function doReset() {
            try {
                const res = await fetch('/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                document.getElementById('solution-output').textContent = 'Cube reset to solved state.';
                syncState(data.state);
            } catch (e) { console.error('Reset failed:', e); }
        }

        // Build face-move buttons
        const FACES = ['U', 'D', 'R', 'L', 'F', 'B'];
        const btnContainer = document.getElementById('move-buttons');
        FACES.forEach(face => {
            [face, face + "'", face + '2'].forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = name;
                btn.onclick = () => sendMove(name);
                btnContainer.appendChild(btn);
            });
        });

        // Initial state load
        fetchState();
    </script>
</body>
</html>
